<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player Overlay</title>
    <link rel="stylesheet" href="player_overlay.css">
</head>
<body>
    <div class="player-container">
        <div class="top-section">
            <div class="text-section">
                <div class="song-title" id="song-title">Song Title</div>
                <div class="artist-name" id="artist-name">Neural Rhythms</div>
            </div>
            <div class="nav-icon" id="nav-icon">▶</div>
        </div>
        <div class="progress-section">
            <div class="time-container">
                <span class="current-time" id="current-time">0:00</span>
                <span class="total-time" id="total-time">0:00</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar-unfilled"></div>
                <div class="progress-bar-filled" id="progress-filled"></div>
                <div class="progress-scrubber" id="progress-scrubber"></div>
            </div>
        </div>
    </div>
</body>
</html>
